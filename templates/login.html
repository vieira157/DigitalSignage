<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Digital Signage</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#1e3a8a);font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033}.card{width:min(420px,calc(100vw - 28px));background:#fff;border-radius:18px;padding:34px;box-shadow:0 24px 80px rgba(0,0,0,.28)}h1{margin:0;font-size:27px;letter-spacing:-.6px}.sub{margin:7px 0 24px;color:#667085;font-size:13px;line-height:1.5}.field{display:grid;gap:7px;margin-top:14px}label{font-size:12px;font-weight:800;letter-spacing:.35px;text-transform:uppercase;color:#667085}input{font:inherit;border:1px solid #d6dce5;border-radius:10px;padding:12px}input:focus{outline:3px solid #bfdbfe;border-color:#2563eb}.btn{width:100%;margin-top:20px;border:0;border-radius:10px;background:#2563eb;color:#fff;padding:13px;font-weight:800;cursor:pointer}.error{border:1px solid #fecaca;background:#fff1f0;color:#991b1b;border-radius:10px;padding:11px 13px;font-size:12px;margin-bottom:14px}.foot{margin-top:20px;color:#98a2b3;font-size:12px;text-align:center}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.logo{width:42px;height:42px;border-radius:12px;background:#eff6ff;display:grid;place-items:center;color:#2563eb;font-weight:900}
</style>
</head><body>
<form class="card" method="post" action="/login">
  <div class="brand"><div class="logo">DS</div><div><h1>Digital Signage</h1><div class="sub">Console corporativo Arvedi</div></div></div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="login-username">Usuário</label><input id="login-username" name="username" autocomplete="username" autofocus required></div>
  <div class="field"><label for="login-password">Senha</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn" type="submit">Entrar</button>
  <div class="foot">Servidor {{ app_version }}</div>
</form>
</body></html>
